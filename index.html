<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acolyte for Lockton Leadership</title>
<meta name="description" content="Acolyte: a One Lockton technology partner. A short video prepared for Lockton leadership.">
<meta property="og:title" content="Acolyte: a One Lockton technology partner">
<meta property="og:image" content="poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette and type match the Lockton script artifact and the video's own title card. */
  :root {
    --bg: #F6F8F9; --surface: #FFFFFF; --ink: #3A4E60; --muted: #66788A; --line: #DCE3E8;
    --teal-text: #2F7F84; --rose-text: #A94C72;
    --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1B242D; --surface: #24303B; --ink: #E4EAF0; --muted: #9AAAB8; --line: #34424F;
    --teal-text: #7CCDD2; --rose-text: #E39AB6; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #1B242D; --surface: #24303B; --ink: #E4EAF0; --muted: #9AAAB8; --line: #34424F;
    --teal-text: #7CCDD2; --rose-text: #E39AB6; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 64px; display: grid; gap: 20px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-text); }
  h1 { margin: 0; font-size: clamp(26px, 4.4vw, 40px); font-weight: 700; line-height: 1.15; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--rose-text); }
  .player { background: #000; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; }
  video { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Prepared for Lockton leadership</div>
  <h1>Acolyte: a <em>One Lockton</em> technology partner</h1>
  <div class="player">
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="video/lockton-leadership-v11.mp4" type="video/mp4">
    </video>
  </div>
</main>
</body>
</html>
